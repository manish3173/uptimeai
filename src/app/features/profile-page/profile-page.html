<div class="profile-page">
  <!-- ======================= Left panel ======================= -->
  <app-profile-sidebar
    [user]="user()"
    [orgs]="orgs()"
    [achievements]="achievements()"
    [linkedinHandle]="linkedinHandle"
  />

  <!-- ======================= Right panel ====================== -->
  <main class="profile-main">
    @if (apiNotice(); as notice) {
      <div class="api-notice" role="status">
        <app-icon name="info" />
        <span>{{ notice }}</span>
      </div>
    }

    <app-profile-tabs
      [tabs]="tabs()"
      [activeTab]="activeTab()"
      (tabChange)="selectTab($event)"
    />

    @switch (activeTab()) {
      @case ('overview') {
        <app-pinned-repos [repos]="mockPinned" />

        <app-contribution-graph
          [calendar]="contribution()?.calendar ?? null"
          [loading]="contributionLoading()"
          [years]="years()"
          [selectedYear]="selectedYear()"
          (yearChange)="onYearChange($event)"
          (refresh)="refreshContributions()"
        />

        <app-activity-overview
          [calendar]="contribution()?.calendar ?? null"
          [events]="events()"
        />
      }

      @case ('repositories') {
        <app-repo-list [repos]="repos()" [loading]="reposLoading()" />
      }

      @case ('projects') {
        <app-empty-state
          icon="project"
          title="No projects yet"
          description="Projects you create or are a member of will show up here. This tab is wired up and ready for the GitHub Projects API."
          hint="GitHub REST API · Projects are still in beta and require a preview accept header."
        />
      }

      @case ('packages') {
        <app-empty-state
          icon="package"
          title="No packages published"
          description="Packages published with GitHub Packages will show up here. This tab is wired up and ready for the GitHub Packages API."
          hint="GitHub REST API · GET /users/{username}/packages"
        />
      }

      @case ('stars') {
        <app-repo-list [repos]="starred()" [loading]="starredLoading()" />
      }
    }
  </main>
</div>
